<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Document</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="stylesheet" href="blog.css?v=2">
</head>

<body class="login_body">
    <div class="login_header">
        <div class="login_header_logo">
            <img src="/assets/logo/logo.svg" alt="" class="login_header_logo_img">
        </div>
    </div>
    <div class="signup_wrap">
        <div class="signup_wrap_container">
            <div class="signup">
                <div class="signup_container">
                    <div class="signup_header">
                        <h3 class="signup_header_title">Добро пожаловать</h3>
                        <p class="signup_heaer_text">Введите Email — мы пришлем код для быстрого входа и создания
                            аккаунта</p>
                    </div>
                    <div class="signup_center">
                        <div class="signup_btns"> <button type="button" class="signup_btn js-login-tab"> Вход по коду
                            </button> <button type="button" class="signup_btn signup_btn_fill js-login-tab"> Вход по
                                паролю </button> </div> <!-- Email -->
                        <div class="signup_form_group"> <label for="email" class="signup_form_label">Email*</label>
                            <input class="signup_form_inp" type="email" id="email" name="email"
                                placeholder="Введите ваш Email">
                        </div> <!-- Вход по паролю -->
                        <div class="login_mode login_mode_password">
                            <div class="signup_form_group">
                                <div class="signup_form_group_header"> <label for="password" class="signup_form_label">
                                        Пароль* </label>
                                    <p class="signup_form_group_header_forgot"> Забыли пароль? </p>
                                </div>
                                <div class="signup_form_inp_wrap"> <input class="signup_form_inp" type="password"
                                        id="password" name="password" placeholder="Введите ваш пароль">
                                    <div class="signup_form_inp_icon"> <img src="/assets/icon/seepass.svg" alt=""
                                            class="signup_form_inp_icon_img"> </div>
                                </div>
                            </div> <button type="button" class="signup_btn signup_btn_dark"> Войти </button>
                        </div> <!-- Вход по коду -->
                        <div class="login_mode login_mode_code" style="display: none;">
                            <!-- <div class="signup_form_group"> <label class="signup_form_label"> Код из Email* </label>
                                <div class="confirm_codes"> <input class="confirm_code_inp" type="text" maxlength="1"
                                        inputmode="numeric"> <input class="confirm_code_inp" type="text" maxlength="1"
                                        inputmode="numeric"> <input class="confirm_code_inp" type="text" maxlength="1"
                                        inputmode="numeric"> <input class="confirm_code_inp" type="text" maxlength="1"
                                        inputmode="numeric"> <input class="confirm_code_inp" type="text" maxlength="1"
                                        inputmode="numeric"> <input class="confirm_code_inp" type="text" maxlength="1"
                                        inputmode="numeric"> </div>
                            </div>  -->
                            <button type="button" class="signup_btn signup_btn_dark"> Получить код </button>
                        </div>
                        <div class="signup_footer">
                            <p class="signup_footer_text"> Отправляя форму вы даете согласие на </p> <a
                                href="/terms-of-service.html" class="signup_footer_link"> обработку персональных данных
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="login_footer">
        <div class="login_footer_container">
            <p class="login_footer_text">© 2026 TURBOSET </p>
            <a href="/privacy-settings.html" class="login_footer_link">Политика конфиденциальности</a>
            <a href="/terms-of-service.html" class="login_footer_link">Пользовательское соглашение</a>
            <a href="/" class="login_footer_link">Согласие на обработку персональных данных</a>
        </div>
    </div>
</body>

<script src="script.js?v=2"></script>

</html>
