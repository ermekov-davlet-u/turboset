<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/assets/logo/sim-logo.svg">
    <title>TURBOSET</title>
    <link rel="stylesheet" href="style.css?v=3">
    <link rel="stylesheet" href="blog.css?v=3">
    <link rel="stylesheet" href="lk.css?v=3">
</head>

<body class="login_body">
    <div class="main_wrap">

        <div class="main_container">
            <div class="login_header">
                <a href="/" class="login_header_logo">
                    <img src="/assets/logo/logo.svg" alt="" class="login_header_logo_img">
                </a>
            </div>
            <main class="lk-main" style="background-color: #F2F2F2;">
                <div class="no_device">

                    <div class="no_device_content">
                        <div class="no_device_content_icon">
                            <img src="/assets/picture/account-delete.svg" alt="" class="no_device_content_img">
                        </div>
                    </div>
                    <div class="no_device_header">
                        <h3 class="delete_title">
                            Аккаунт удален
                        </h3>
                        <p class="delete_text">
                            Все ваши данные удалены. <br>
                            Спасибо, что были с нами.
                        </p>
                    </div>
                    <div class="no_device_footer">
                        <a href="/" class="lk_button lk_button_fill">
                            <p class="lk_button_text">Вернуться на главную</p>
                        </a>
                    </div>
                </div>

            </main>
            <div class="login_footer">
                <div class="login_footer_container">
                    <p class="login_footer_text">© 2026 TURBOSET </p>
                    <a href="/privacy-settings.html" class="login_footer_link">Политика
                        конфиденциальности</a>
                    <a href="/terms-of-service.html" class="login_footer_link">Пользовательское
                        соглашение</a>
                    <a href="/" class="login_footer_link">Согласие на
                        обработку персональных данных</a>
                </div>
            </div>
        </div>

        <div class="lk_sidebar_overlay lk_sidebar_overlay_right" id="lkSidebarOverlayRight"></div>
        <aside class="lk_sidebar lk_sidebar_right" id="lkSidebarRight">

            <button class="lk_sidebar_close" id="lkSidebarRightClose" type="button">
                ×
            </button>

            <div class="lk_sidebar_logo">
                <p style="font-weight:600;">Панель</p>
            </div>

            <nav class="lk_sidebar_nav">
                <!-- контент правой панели будет добавлен позже -->
            </nav>

        </aside>
    </div>
</body>

<script src="script.js?v=3"></script>

</html>
